# Dev overlay: bind-mount source so code changes take effect without a rebuild.
# The pinned image (deps, base images) is only rebuilt when deps change.
# Usage: docker compose run --rm picoir
services:
  picoir:
    volumes:
      - ../picohp-ir2:/app
      - ../pico_runtime:/pico_runtime
      - vendordata:/app/vendor
volumes:
  vendordata:
